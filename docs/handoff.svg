<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A handoff from Claude Code to Codex</title>
  <desc>Claude Code's hooks send each event to agent-autosave, which appends it to the ledger; at 85% of its usage window Claude Code is asked for a handoff note; when it hits its limit the compiler writes the save (save.json and SAVE.md); agent-autosave go asks once and starts Codex with the save as its first prompt, and Codex continues the same task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .key { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.5; }
      .agent { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .done { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; }
      .step { font-size: 11px; font-weight: 700; fill: #8b5cf6; letter-spacing: 0.06em; }
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .text { font-size: 12px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #0e7490; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .label { font-size: 11.5px; fill: #64748b; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="330" rx="14" fill="#f8fafc"/>

  <rect class="agent" x="20" y="40" width="160" height="150" rx="10"/>
  <text class="step" x="34" y="62">1 · WORK</text>
  <text class="title" x="34" y="84">Claude Code</text>
  <text class="text" x="34" y="106">you prompt, it plans,</text>
  <text class="text" x="34" y="124">edits, runs commands;</text>
  <text class="text" x="34" y="142">at 85% it writes a</text>
  <text class="text" x="34" y="160">handoff note, then</text>
  <text class="text" x="34" y="178">hits its limit</text>

  <rect class="box" x="212" y="40" width="160" height="150" rx="10"/>
  <text class="step" x="226" y="62">2 · HOOKS</text>
  <text class="title" x="226" y="84">8 hook events</text>
  <text class="mono" x="226" y="106">agent-autosave hook</text>
  <text class="text" x="226" y="128">prompt · tool · todo ·</text>
  <text class="text" x="226" y="146">stop · limit · usage</text>
  <text class="text" x="226" y="170">redacted, exits 0</text>

  <rect class="key" x="404" y="40" width="160" height="150" rx="10"/>
  <text class="step" x="418" y="62">3 · LEDGER</text>
  <text class="title" x="418" y="84">Event ledger</text>
  <text class="mono" x="418" y="106">events.jsonl</text>
  <text class="text" x="418" y="128">one line per event,</text>
  <text class="text" x="418" y="146">append only,</text>
  <text class="text" x="418" y="164">file-locked</text>

  <rect class="key" x="596" y="40" width="160" height="150" rx="10"/>
  <text class="step" x="610" y="62">4 · SAVE</text>
  <text class="title" x="610" y="84">The save</text>
  <text class="mono" x="610" y="106">SAVE.md, save.json</text>
  <text class="text" x="610" y="128">goal, plan, failing</text>
  <text class="text" x="610" y="146">command, handoff note,</text>
  <text class="text" x="610" y="164">files, git, next action</text>

  <rect class="done" x="788" y="40" width="152" height="150" rx="10"/>
  <text class="step" x="802" y="62" style="fill:#16a34a">5 · CONTINUE</text>
  <text class="title" x="802" y="84">Codex</text>
  <text class="text" x="802" y="106">starts with the plan,</text>
  <text class="text" x="802" y="124">the failing test, the</text>
  <text class="text" x="802" y="142">note and project</text>
  <text class="text" x="802" y="160">memory, and finishes</text>

  <path class="edge" d="M180,115 L210,115"/>
  <path class="edge" d="M372,115 L402,115"/>
  <path class="edge" d="M564,115 L594,115"/>
  <path class="edge" d="M756,115 L786,115"/>

  <rect class="box" x="404" y="226" width="536" height="72" rx="10"/>
  <text class="mono" x="420" y="254">$ agent-autosave go claude-code codex</text>
  <text class="text" x="420" y="278">at the limit, Enter records the handoff and runs codex with the save</text>
  <path class="edge" d="M864,226 L864,192"/>
  <text class="label" x="20" y="254">Nothing leaves the repo: every step</text>
  <text class="label" x="20" y="272">writes to .autosave/ on your disk.</text>
</svg>
